services:
  api:
    image: khurram513/blog-app-server:latest
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    dns:
      - 8.8.8.8
      - 1.1.1.1

  web:
    build:
      context: ../blog-app-client
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "8080:80"