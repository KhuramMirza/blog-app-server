name: Deploy Backend to EC2

# 1. This tells GitHub to run this script every time you push to the main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 2. The robot downloads your raw code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 3. The robot logs into your Docker Hub account
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. The robot builds your image and pushes it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/blog-app-server:latest

      # 5. The robot SSH's into your AWS server and tells it to restart
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/my-blog-app/blog-app-server
            docker compose pull api
            docker compose up -d
            docker system prune -f